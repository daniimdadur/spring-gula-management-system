services:
  spring_gula_management:
    image: mysql:latest
    container_name: gula_mysql
    environment:
      MYSQL_ROOT_PASSWORD: P@ssW0rd32!
      MYSQL_DATABASE: gulahub_db
      MYSQL_USER: imddur13
      MYSQL_PASSWORD: P@ssW0rd32!
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 5
  redis:
    image: redis:latest
    container_name: gulahub_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 5
    restart: unless-stopped